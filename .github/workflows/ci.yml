name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The deploy job talks to Cloudflare, not to the
# repository, so nothing here needs write access to anything.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck / Lint / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      # `--ignore-scripts` everywhere in CI.
      #
      # The 2025 "Shai-Hulud" npm worm propagated through `postinstall` hooks and
      # harvested credentials at install time — before a single line of project
      # code ran. Having zero *runtime* dependencies buys no protection from that:
      # `npm ci` still executes install hooks from the whole dev tree. This tree
      # contains two (esbuild and workerd), and both only validate a platform
      # binary that npm has already placed via an optional dependency; both were
      # checked to work without their hooks. Playwright's browsers were never
      # installed by a hook and have their own step below.
      - run: npm ci --ignore-scripts

      # Single gate: typecheck && lint && test && build.
      - run: npm run verify

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts

      # Browser binaries are NOT installed by `npm ci` — they must be fetched here.
      # Only chromium is installed; playwright.config.ts pins the iPhone 14 project to
      # chromium too. Add `webkit` here if you re-enable real WebKit for mobile.
      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-backend:
    name: Playwright E2E (real Worker + D1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npx playwright install --with-deps chromium

      # The other e2e job runs against `vite dev`, which serves neither the
      # Worker nor a database — so `server/db/d1.ts` had no automated coverage at
      # all and a column typo would have shipped (BACKLOG § 4.5).
      #
      # This one brings up `wrangler dev` over miniflare's local SQLite, behind
      # a Vite dev server proxying `/api` at `changeOrigin: false` so the
      # browser sees one origin and the `SameSite=Strict` identity cookie behaves
      # as it does in production. Both servers, the build and the migration are
      # started by `playwright.backend.config.ts`; **no Cloudflare credentials
      # are involved**, which is why this can run on a pull request.
      - run: npm run e2e:backend

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-backend
          path: playwright-report/
          retention-days: 7

  restore-drill:
    name: Restore drill (fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts

      # Runs against the committed fixture dump, so it needs no Cloudflare
      # credentials: `wrangler d1 execute --local` is miniflare's SQLite.
      #
      # This run proves nothing about production data. It proves the drill still
      # works — so that `backup.yml`'s weekly run against the real export is not
      # the thing that discovers this script has rotted. Same reasoning as the
      # purity guard: the check worth having is the one that runs every push.
      - run: npm run drill

      # The migrations have to keep applying to an empty database too. The
      # `--remote` step in `deploy` is the only place they ever run for real, and
      # that is not where you want to find out that 0002 has a typo in it.
      - run: npm run migrate:local

  deploy:
    name: Deploy to Cloudflare Workers
    # Never on a pull request, and never from a branch: a deploy is what landing
    # on `main` means. Both conditions, because a `pull_request` event can carry
    # a ref that looks like main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verify, e2e, e2e-backend, restore-drill]
    runs-on: ubuntu-latest
    # A GitHub environment, so the Cloudflare credentials are scoped to it and a
    # required reviewer can be switched on without touching this file.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      # ── The step everybody forgets ──────────────────────────────────────────
      #
      # **D1 migrations are NOT applied by a deploy.** `wrangler deploy` ships
      # the Worker and touches the database not at all, so a schema change
      # that is not applied here is a new Worker talking to the old schema. That
      # is the classic D1 outage, and it is entirely self-inflicted.
      #
      # It runs BEFORE the deploy, as a step of its own, so a failure stops the
      # deploy instead of half-completing it. That ordering is only safe because
      # migrations are expand-only: the *old* Worker has to survive meeting the
      # *new* schema for the window between these two steps — and indefinitely if
      # the deploy is later rolled back. Anything that narrows a shape must be
      # split expand → migrate → contract across two deploys.
      - name: Apply D1 migrations (gated, expand-only)
        run: npx wrangler d1 migrations apply colors --remote

      - name: Deploy
        run: npx wrangler deploy

      # Liveness only. `/api/health` must not query D1 (see
      # `server/handlers/health.ts`), so this answers "the Worker is up", which is
      # what a post-deploy check is for. `/api/health/deep` is the hand-called one.
      - name: Smoke the deploy
        if: ${{ vars.DEPLOY_URL != '' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "${DEPLOY_URL}/api/health" | grep -q '"ok":true'; then
              echo "healthy"
              exit 0
            fi
            echo "not healthy yet (attempt ${attempt})"
            sleep 10
          done
          echo "the deployment never reported healthy"
          exit 1
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
